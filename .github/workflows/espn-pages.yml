name: NODE47 ESPN collect and publish

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/espn-pages.yml"
  schedule:
    - cron: "17 */6 * * *"
      timezone: "Africa/Douala"
  push:
    branches: [main, feature/node47-data-api-v0.0.7]
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/espn-pages.yml"

permissions:
  contents: read

concurrency:
  group: node47-espn-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate activation census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path("config/registry.json").read_text())
          config = json.loads(Path("config/competitions.json").read_text())
          enabled = [item for item in config["competitions"] if item.get("enabled")]
          keys = {(item["sport"], item["league"]) for item in enabled}
          active_registry = {(item["sport"], item["competition_id"]) for item in registry["entries"] if item.get("collection_enabled")}
          assert len(keys) == len(enabled), f"duplicate enabled routes: {len(enabled)} entries, {len(keys)} unique"
          assert keys == active_registry, f"enabled/registry mismatch: missing={active_registry-keys}, extra={keys-active_registry}"
          assert {sport for sport, _ in keys} == {"soccer", "basketball", "tennis"}
          counts = {}
          for sport, _ in keys:
              counts[sport] = counts.get(sport, 0) + 1
          print(f"Validated {len(keys)} unique enabled routes: {counts}")
          PY
      - name: Collect ESPN data
        env:
          PYTHONPATH: src
        run: python -m node47_espn.cli --config config/competitions.json --output site
      - name: Verify full collection manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("site/data/latest.json").read_text())
          coverage = data["coverage"]
          configured = [item for item in json.loads(Path("config/competitions.json").read_text())["competitions"] if item.get("enabled")]
          expected = {(item["sport"], item["league"]) for item in configured}
          actual = {(row["sport"], row["league"]) for row in coverage}
          assert len(coverage) == len(expected), f"coverage rows {len(coverage)} != configured routes {len(expected)}"
          assert actual == expected, f"coverage/config mismatch: missing={expected-actual}, extra={actual-expected}"
          counts = {}
          for row in coverage:
              counts[row["sport"]] = counts.get(row["sport"], 0) + 1
          print(f"Collection completed: {len(coverage)} routes; {data['event_count']} events; {counts}")
          print("Observed statuses:", {status: sum(1 for x in coverage if x["status"] == status) for status in ("ok", "empty", "unavailable")})
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: collect
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
