name: NODE47 archive analysis report

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Render correlation ID
        required: true
        type: string
      sport:
        description: Sport folder
        required: true
        type: choice
        options:
          - football
          - basketball
          - tennis
      event_slug:
        description: Safe event slug
        required: true
        type: string
      event_date:
        description: Event date YYYY-MM-DD
        required: true
        type: string
      report_markdown:
        description: Complete final NODE.47 Markdown report
        required: true
        type: string
      callback_url:
        description: Authenticated Render callback URL
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: node47-report-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate report and write immutable Markdown file
        id: report
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SPORT: ${{ inputs.sport }}
          EVENT_SLUG: ${{ inputs.event_slug }}
          EVENT_DATE: ${{ inputs.event_date }}
          REPORT_MARKDOWN: ${{ inputs.report_markdown }}
        run: |
          python - <<'PY'
          import os, re
          from datetime import date
          from pathlib import Path

          request_id = os.environ["REQUEST_ID"]
          sport = os.environ["SPORT"]
          slug = os.environ["EVENT_SLUG"]
          event_date = os.environ["EVENT_DATE"]
          report = os.environ["REPORT_MARKDOWN"]

          if not re.fullmatch(r"[0-9a-f-]{36}", request_id):
              raise SystemExit("Invalid request_id")
          if sport not in {"football", "basketball", "tennis"}:
              raise SystemExit("Invalid sport")
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug) or len(slug) > 100:
              raise SystemExit("Invalid event_slug")
          date.fromisoformat(event_date)
          if not report.strip() or len(report.encode("utf-8")) > 60000:
              raise SystemExit("Report is empty or exceeds 60 KB")
          if not re.search(r"\b(BET PRUDENT|BET|NO BET)\b", report, re.I):
              raise SystemExit("Final verdict is missing")

          path = Path("reports") / sport / f"{event_date}-{slug}-{request_id[:8]}.md"
          path.parent.mkdir(parents=True, exist_ok=True)
          if path.exists():
              raise SystemExit("Refusing to overwrite an existing report")
          path.write_text(report.rstrip() + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"path={path.as_posix()}\n")
          print(f"Prepared immutable report: {path.as_posix()}")
          PY

      - name: Commit report
        id: commit
        env:
          REPORT_PATH: ${{ steps.report.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$REPORT_PATH"
          git commit -m "Archive NODE.47 analysis report: $REPORT_PATH"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Confirm committed report to Render
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_SECRET: ${{ secrets.NODE47_RENDER_CALLBACK_SECRET }}
          REPORT_PATH: ${{ steps.report.outputs.path }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen

          secret = os.environ.get("CALLBACK_SECRET", "")
          if not secret:
              raise SystemExit("NODE47_RENDER_CALLBACK_SECRET is missing")
          path = os.environ["REPORT_PATH"]
          payload = {
              "request_id": os.environ["REQUEST_ID"],
              "status": "ok",
              "path": path,
              "url": "https://github.com/node47sporttrading/NODE47-ESPN-DATA/blob/main/" + path,
              "commit_sha": os.environ["COMMIT_SHA"],
          }
          req = Request(
              os.environ["CALLBACK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "X-NODE47-Callback-Secret": secret,
              },
              method="POST",
          )
          with urlopen(req, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"Render callback failed: HTTP {response.status}")
              print("Render confirmed report archival callback.")
          PY

      - name: Report archival failure callback
        if: failure()
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_SECRET: ${{ secrets.NODE47_RENDER_CALLBACK_SECRET }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          secret = os.environ.get("CALLBACK_SECRET", "")
          if not secret:
              raise SystemExit("NODE47_RENDER_CALLBACK_SECRET is missing")
          payload = {
              "request_id": os.environ["REQUEST_ID"],
              "status": "error",
              "error": "GitHub Actions failed before report archival could be confirmed."
          }
          req = Request(
              os.environ["CALLBACK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "X-NODE47-Callback-Secret": secret},
              method="POST",
          )
          with urlopen(req, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"Render failure callback failed: HTTP {response.status}")
          PY
