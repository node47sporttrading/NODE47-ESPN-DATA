name: NODE47 archive analysis report

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Render correlation ID
        required: true
        type: string
      sport:
        description: Sport folder
        required: true
        type: choice
        options:
          - football
          - basketball
          - tennis
      event_slug:
        description: Safe event slug
        required: true
        type: string
      event_date:
        description: Event date YYYY-MM-DD
        required: true
        type: string
      report_markdown:
        description: Complete final NODE.47 Markdown report
        required: true
        type: string
      callback_url:
        description: Authenticated Render callback URL
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and commit immutable Markdown report
        id: archive
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SPORT: ${{ inputs.sport }}
          EVENT_SLUG: ${{ inputs.event_slug }}
          EVENT_DATE: ${{ inputs.event_date }}
          REPORT_MARKDOWN: ${{ inputs.report_markdown }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, re
          from datetime import date
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          request_id = os.environ["REQUEST_ID"]
          sport = os.environ["SPORT"]
          slug = os.environ["EVENT_SLUG"]
          event_date = os.environ["EVENT_DATE"]
          report = os.environ["REPORT_MARKDOWN"]

          if not re.fullmatch(r"[0-9a-f-]{36}", request_id):
              raise SystemExit("Invalid request_id")
          if sport not in {"football", "basketball", "tennis"}:
              raise SystemExit("Invalid sport")
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug) or len(slug) > 100:
              raise SystemExit("Invalid event_slug")
          date.fromisoformat(event_date)
          if not report.strip() or len(report.encode("utf-8")) > 60000:
              raise SystemExit("Report is empty or exceeds 60 KB")
          if not re.search(r"\b(BET PRUDENT|BET|NO BET)\b", report, re.I):
              raise SystemExit("Final verdict is missing")

          path = f"reports/{sport}/{event_date}-{slug}-{request_id[:8]}.md"
          token = os.environ["GITHUB_TOKEN"]
          if not token:
              raise SystemExit("GitHub Actions token is missing")
          api = "https://api.github.com/repos/node47sporttrading/NODE47-ESPN-DATA/contents/" + path
          payload = {
              "message": "Archive NODE.47 analysis report: " + path,
              "content": base64.b64encode((report.rstrip() + "\n").encode("utf-8")).decode("ascii"),
              "branch": "main",
          }
          req = Request(
              api,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="PUT",
          )
          try:
              with urlopen(req, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except HTTPError as exc:
              body = exc.read(1000).decode("utf-8", "replace")
              raise SystemExit(f"GitHub Contents API rejected report: HTTP {exc.code}; {body}")
          commit_sha = result.get("commit", {}).get("sha")
          if not commit_sha or result.get("content", {}).get("path") != path:
              raise SystemExit("GitHub did not return the expected committed file and SHA")
          report_url = "https://github.com/node47sporttrading/NODE47-ESPN-DATA/blob/main/" + path
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"path={path}\n")
              out.write(f"url={report_url}\n")
              out.write(f"commit_sha={commit_sha}\n")
          print(f"Report committed: {path}; commit={commit_sha}")
          PY

      - name: Confirm committed report to Render
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_SECRET: ${{ secrets.NODE47_RENDER_CALLBACK_SECRET }}
          REPORT_PATH: ${{ steps.archive.outputs.path }}
          REPORT_URL: ${{ steps.archive.outputs.url }}
          COMMIT_SHA: ${{ steps.archive.outputs.commit_sha }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          secret = os.environ.get("CALLBACK_SECRET", "")
          if not secret:
              raise SystemExit("NODE47_RENDER_CALLBACK_SECRET is missing")
          payload = {
              "request_id": os.environ["REQUEST_ID"],
              "status": "ok",
              "path": os.environ["REPORT_PATH"],
              "url": os.environ["REPORT_URL"],
              "commit_sha": os.environ["COMMIT_SHA"],
          }
          req = Request(
              os.environ["CALLBACK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "X-NODE47-Callback-Secret": secret},
              method="POST",
          )
          with urlopen(req, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"Render callback failed: HTTP {response.status}")
              print("Render confirmed report archival callback.")
          PY

      - name: Report archival failure callback
        if: failure()
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_SECRET: ${{ secrets.NODE47_RENDER_CALLBACK_SECRET }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          secret = os.environ.get("CALLBACK_SECRET", "")
          if not secret:
              raise SystemExit("NODE47_RENDER_CALLBACK_SECRET is missing")
          payload = {
              "request_id": os.environ["REQUEST_ID"],
              "status": "error",
              "error": "GitHub Actions failed before report archival could be confirmed."
          }
          req = Request(
              os.environ["CALLBACK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "X-NODE47-Callback-Secret": secret},
              method="POST",
          )
          with urlopen(req, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"Render failure callback failed: HTTP {response.status}")
          PY
