name: NODE47 on-demand SearXNG search

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID generated by the Render API
        required: true
        type: string
      query:
        description: Search query
        required: true
        type: string
      categories:
        description: SearXNG categories
        required: false
        default: general,news
        type: string
      language:
        description: Search language
        required: false
        default: fr
        type: string
      time_range:
        description: day, week, month, year or none
        required: false
        default: week
        type: string
      safesearch:
        description: Safe search level (0-2)
        required: false
        default: "1"
        type: string
      max_results:
        description: Maximum number of results (1-20)
        required: false
        default: "10"
        type: string
      fetch_pages:
        description: Fetch and extract the contents of the best search-result pages
        required: false
        default: "true"
        type: string
      callback_url:
        description: Authenticated Render callback endpoint
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: node47-searxng-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Log request context
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          QUERY: ${{ inputs.query }}
          CATEGORIES: ${{ inputs.categories }}
          LANGUAGE: ${{ inputs.language }}
          TIME_RANGE: ${{ inputs.time_range }}
          MAX_RESULTS: ${{ inputs.max_results }}
          FETCH_PAGES: ${{ inputs.fetch_pages }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          echo "::group::NODE.47 SearXNG — request context"
          echo "Request ID: $REQUEST_ID"
          echo "Query: $QUERY"
          echo "Categories: $CATEGORIES"
          echo "Language: $LANGUAGE"
          echo "Time range: $TIME_RANGE"
          echo "Maximum results: $MAX_RESULTS"
          echo "Callback host/path: $(python -c 'import os,urllib.parse; u=urllib.parse.urlsplit(os.environ["CALLBACK_URL"]); print(u.netloc + u.path)')"
          echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
          echo "Started at (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "::endgroup::"

      - name: Checkout NODE.47 SearXNG configuration
        uses: actions/checkout@v4

      - name: Start pinned ephemeral SearXNG image
        run: |
          set -Eeuo pipefail
          echo "::group::SearXNG container startup"
          docker --version
          docker run -d --name node47-searxng-actions -p 127.0.0.1:8080:8080 \
            -v "$GITHUB_WORKSPACE/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            -e SEARXNG_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            -e SEARXNG_BIND_ADDRESS=0.0.0.0 \
            -e SEARXNG_PORT=8080 \
            -e SEARXNG_LIMITER=false \
            -e SEARXNG_PUBLIC_INSTANCE=false \
            searxng/searxng:2026.11.20-a7959eeaf
          echo "Container started:"
          docker ps --filter name=node47-searxng-actions --no-trunc
          echo "::endgroup::"

      - name: Execute search and return results to Render
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          QUERY: ${{ inputs.query }}
          CATEGORIES: ${{ inputs.categories }}
          LANGUAGE: ${{ inputs.language }}
          TIME_RANGE: ${{ inputs.time_range }}
          SAFESEARCH: ${{ inputs.safesearch }}
          MAX_RESULTS: ${{ inputs.max_results }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_SECRET: ${{ secrets.NODE47_RENDER_CALLBACK_SECRET }}
        run: |
          python - <<'PY'
          import html, ipaddress, json, os, re, socket, sys, time
          from html.parser import HTMLParser
          from urllib.parse import urlencode, urlsplit, urljoin
          from urllib.request import Request, urlopen, build_opener, HTTPRedirectHandler
          from urllib.error import URLError, HTTPError

          request_id = os.environ["REQUEST_ID"]
          started = time.monotonic()
          stage = "initialisation"

          def log(message):
              print(f"[NODE47][{request_id}][{stage}] {message}", flush=True)

          def response_error(exc):
              if isinstance(exc, HTTPError):
                  try:
                      body = exc.read(1200).decode("utf-8", "replace")
                  except Exception:
                      body = "<response body unavailable>"
                  return f"HTTP {exc.code} {exc.reason}; response={body[:1200]}"
              if isinstance(exc, URLError):
                  return f"URL/network error: {exc.reason}"
              return f"{type(exc).__name__}: {str(exc)[:1200]}"

          class SafeTextParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts = []
                  self.title_parts = []
                  self.meta = {}
                  self.in_title = False
                  self.skip_depth = 0
                  self.skip_tags = {"script", "style", "noscript", "svg", "nav", "footer", "header", "form", "aside"}
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag in self.skip_tags:
                      self.skip_depth += 1
                  if tag == "title":
                      self.in_title = True
                  if tag == "meta":
                      key = (attrs.get("property") or attrs.get("name") or "").lower()
                      value = attrs.get("content")
                      if key and value and key in {"og:title", "og:description", "description", "article:published_time", "date", "dc.date"}:
                          self.meta[key] = value[:500]
              def handle_endtag(self, tag):
                  if tag in self.skip_tags and self.skip_depth:
                      self.skip_depth -= 1
                  if tag == "title":
                      self.in_title = False
              def handle_data(self, data):
                  value = " ".join(data.split())
                  if not value:
                      return
                  if self.in_title:
                      self.title_parts.append(value)
                  if not self.skip_depth:
                      self.parts.append(value)
              def text(self):
                  return re.sub(r"\\s+", " ", " ".join(self.parts)).strip()

          def validate_public_url(url):
              parsed = urlsplit(url)
              if parsed.scheme not in ("http", "https") or not parsed.hostname or parsed.username or parsed.password:
                  raise ValueError("unsupported_url")
              if parsed.port not in (None, 80, 443):
                  raise ValueError("unsupported_port")
              host = parsed.hostname.rstrip(".")
              addresses = {item[4][0] for item in socket.getaddrinfo(host, parsed.port or (443 if parsed.scheme == "https" else 80), type=socket.SOCK_STREAM)}
              if not addresses:
                  raise ValueError("dns_no_address")
              for address in addresses:
                  ip = ipaddress.ip_address(address)
                  if not ip.is_global:
                      raise ValueError("non_public_address")
              return url

          class SafeRedirectHandler(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  target = urljoin(req.full_url, newurl)
                  validate_public_url(target)
                  return super().redirect_request(req, fp, code, msg, headers, target)

          SAFE_OPENER = build_opener(SafeRedirectHandler())

          def fetch_source_page(url):
              try:
                  validate_public_url(url)
                  request = Request(url, headers={"User-Agent": "NODE47-EvidenceReader/1.0 (+source verification)", "Accept": "text/html,application/xhtml+xml,text/plain;q=0.8"})
                  with SAFE_OPENER.open(request, timeout=12) as response:
                      final_url = response.geturl()
                      validate_public_url(final_url)
                      content_type = response.headers.get("Content-Type", "").lower()
                      if not ("text/html" in content_type or "application/xhtml+xml" in content_type or "text/plain" in content_type):
                          return {"fetch_status": "unsupported_content_type", "page_url": final_url, "page_content": ""}
                      body = response.read(700001)
                      if len(body) > 700000:
                          return {"fetch_status": "page_too_large", "page_url": final_url, "page_content": ""}
                  decoded = body.decode("utf-8", "replace")
                  if "text/plain" in content_type:
                      text = re.sub(r"\\s+", " ", decoded).strip()
                      title = ""
                      metadata = {}
                  else:
                      parser = SafeTextParser()
                      parser.feed(decoded[:700000])
                      text = parser.text()
                      title = " ".join(parser.title_parts)[:300]
                      metadata = parser.meta
                  return {
                      "fetch_status": "ok" if len(text) >= 300 else "limited_text",
                      "page_url": final_url,
                      "page_title": title or metadata.get("og:title", ""),
                      "page_description": metadata.get("og:description") or metadata.get("description", ""),
                      "page_published_date": metadata.get("article:published_time") or metadata.get("date") or metadata.get("dc.date"),
                      "page_content": text[:9000],
                      "page_content_chars": len(text),
                  }
              except HTTPError as exc:
                  return {"fetch_status": f"http_{exc.code}", "page_content": ""}
              except Exception as exc:
                  reason = str(exc)[:180]
                  return {"fetch_status": "blocked_or_unavailable", "fetch_detail": reason, "page_content": ""}

          def callback(payload):
              secret = os.environ.get("CALLBACK_SECRET", "")
              if not secret:
                  raise RuntimeError("Secret NODE47_RENDER_CALLBACK_SECRET is missing in GitHub repository Actions secrets")
              target = urlsplit(os.environ["CALLBACK_URL"])
              log(f"Sending callback to {target.netloc}{target.path}; payload_status={payload.get('status')}; results={len(payload.get('results', []))}")
              body = json.dumps(payload).encode()
              req = Request(
                  os.environ["CALLBACK_URL"],
                  data=body,
                  headers={"Content-Type": "application/json", "X-NODE47-Callback-Secret": secret},
                  method="POST",
              )
              try:
                  with urlopen(req, timeout=20) as response:
                      response_body = response.read(1200).decode("utf-8", "replace")
                      log(f"Render callback response: HTTP {response.status}; body={response_body or '<empty>'}")
                      if response.status not in (200, 202):
                          raise RuntimeError(f"Render callback rejected payload with HTTP {response.status}")
              except Exception as exc:
                  raise RuntimeError(f"Render callback delivery failed: {response_error(exc)}") from None

          try:
              stage = "configuration"
              log("Checking required inputs and callback secret.")
              if not os.environ.get("QUERY", "").strip():
                  raise RuntimeError("Search query is empty.")
              if not os.environ.get("CALLBACK_SECRET", ""):
                  raise RuntimeError("NODE47_RENDER_CALLBACK_SECRET is missing from GitHub Actions secrets.")
              log(f"Query length={len(os.environ['QUERY'])}; categories={os.environ.get('CATEGORIES')}; language={os.environ.get('LANGUAGE')}; time_range={os.environ.get('TIME_RANGE')}")

              stage = "searxng-readiness"
              log("Waiting up to 90 seconds for http://127.0.0.1:8080/ (45 attempts, 2 seconds apart).")
              ready = False
              last_error = "No response received yet"
              for attempt in range(1, 46):
                  try:
                      with urlopen("http://127.0.0.1:8080/", timeout=3) as response:
                          log(f"Readiness attempt {attempt}/45: HTTP {response.status}")
                          if response.status < 500:
                              ready = True
                              break
                          last_error = f"HTTP {response.status}"
                  except Exception as exc:
                      last_error = response_error(exc)
                      if attempt in (1, 5, 10, 20, 30, 40, 45):
                          log(f"Readiness attempt {attempt}/45 failed: {last_error}")
                      time.sleep(2)
              if not ready:
                  raise RuntimeError(f"SearXNG did not become ready after 45 attempts. Last error: {last_error}")
              log(f"SearXNG is ready after {time.monotonic() - started:.1f}s.")

              stage = "search-request"
              params = {
                  "q": os.environ["QUERY"],
                  "format": "json",
                  "categories": os.environ.get("CATEGORIES", "general,news"),
                  "language": os.environ.get("LANGUAGE", "fr"),
                  "safesearch": os.environ.get("SAFESEARCH", "1"),
                  "pageno": "1",
              }
              time_range = os.environ.get("TIME_RANGE", "week")
              if time_range and time_range != "none":
                  params["time_range"] = time_range
              url = "http://127.0.0.1:8080/search?" + urlencode(params)
              log(f"Calling local SearXNG /search; categories={params['categories']}; language={params['language']}; safesearch={params['safesearch']}; time_range={time_range or 'none'}")
              search_started = time.monotonic()
              req = Request(url, headers={"Accept": "application/json"})
              try:
                  with urlopen(req, timeout=90) as response:
                      status = response.status
                      content_type = response.headers.get("Content-Type", "<missing>")
                      body = response.read()
              except Exception as exc:
                  raise RuntimeError(f"SearXNG HTTP request failed: {response_error(exc)}") from None
              log(f"SearXNG HTTP response: status={status}; content_type={content_type}; bytes={len(body)}; elapsed={time.monotonic()-search_started:.1f}s")
              try:
                  data = json.loads(body.decode("utf-8"))
              except Exception as exc:
                  raise RuntimeError(f"SearXNG returned invalid JSON: {type(exc).__name__}: {str(exc)[:500]}; response_preview={body[:1000]!r}") from None

              raw = data.get("results")
              if not isinstance(raw, list):
                  raise RuntimeError(f"SearXNG JSON has no results array; top_level_keys={list(data)[:30]}; response_preview={str(data)[:1000]}")
              unresponsive = data.get("unresponsive_engines", [])
              log(f"Search parsed: raw_results={len(raw)}; unresponsive_engines={json.dumps(unresponsive, ensure_ascii=False)[:2000]}")
              if not raw:
                  log("WARNING: SearXNG returned zero results. Inspect engine errors, query syntax, category, language and time range.")
              limit = max(1, min(20, int(os.environ.get("MAX_RESULTS", "10"))))
              results = []
              engines = {}
              for item in raw[:limit]:
                  if not isinstance(item, dict):
                      continue
                  engine = item.get("engine") or "unknown"
                  engines[engine] = engines.get(engine, 0) + 1
                  results.append({
                      "title": item.get("title"),
                      "url": item.get("url"),
                      "content": item.get("content") or item.get("snippet"),
                      "engine": item.get("engine"),
                      "category": item.get("category") or item.get("categories"),
                      "published_date": item.get("publishedDate"),
                      "score": item.get("score"),
                  })
              log(f"Normalized results={len(results)}; results_by_engine={json.dumps(engines, ensure_ascii=False)}")

          fetch_pages = os.environ.get("FETCH_PAGES", "true").lower() == "true"
          fetched_count = 0
          if fetch_pages:
              stage = "source-page-extraction"
              for result in results[:6]:
                  source_url = result.get("url")
                  if not source_url:
                      result.update({"fetch_status": "missing_url", "page_content": ""})
                      continue
                  extracted = fetch_source_page(source_url)
                  result.update(extracted)
                  fetched_count += 1 if extracted.get("fetch_status") in ("ok", "limited_text") else 0
                  log(f"Page extraction: status={extracted.get('fetch_status')}; host={urlsplit(source_url).netloc[:120]}; chars={len(extracted.get('page_content', ''))}")
          else:
              for result in results:
                  result.update({"fetch_status": "not_requested", "page_content": ""})
          log(f"Page extraction complete: attempted={min(6, len(results)) if fetch_pages else 0}; usable={fetched_count}; fetch_pages={fetch_pages}")

              stage = "render-callback"
              callback({
                  "request_id": request_id,
                  "status": "ok",
                  "results": results,
                  "unresponsive_engines": unresponsive,
              })
              log(f"SUCCESS: {len(results)} results delivered to Render; total_elapsed={time.monotonic()-started:.1f}s")

          except Exception as exc:
              failed_stage = stage
              error = f"{type(exc).__name__}: {str(exc)[:1500]}"
              log(f"FAILURE: {error}")
              try:
                  stage = "error-callback"
                  callback({
                      "request_id": request_id,
                      "status": "error",
                      "error": f"{failed_stage}: {error}",
                      "results": [],
                  })
                  log("Error status successfully delivered to Render.")
              except Exception as callback_exc:
                  print(f"[NODE47][{request_id}][error-callback] SECONDARY FAILURE: {type(callback_exc).__name__}: {str(callback_exc)[:1500]}", file=sys.stderr, flush=True)
              raise
          PY

      - name: Collect SearXNG diagnostics on failure
        if: failure()
        run: |
          echo "::group::SearXNG failure diagnostics"
          echo "--- Docker container state ---"
          docker ps -a --filter name=node47-searxng-actions --no-trunc || true
          echo "--- SearXNG container logs (last 300 lines) ---"
          docker logs --tail 300 node47-searxng-actions 2>&1 || true
          echo "--- Container inspection (state and exit code) ---"
          docker inspect node47-searxng-actions --format '{{json .State}}' 2>&1 || true
          echo "--- Runner disk and memory ---"
          df -h || true
          free -h || true
          echo "::endgroup::"

      - name: Stop ephemeral SearXNG container
        if: always()
        run: |
          echo "Stopping ephemeral SearXNG container."
          docker rm -f node47-searxng-actions || true
