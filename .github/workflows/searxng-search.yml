name: NODE47 on-demand SearXNG search

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID generated by the Render API
        required: true
        type: string
      query:
        description: Search query
        required: true
        type: string
      categories:
        description: SearXNG categories
        required: false
        default: general,news
        type: string
      language:
        description: Search language
        required: false
        default: fr
        type: string
      time_range:
        description: day, week, month, year or none
        required: false
        default: week
        type: string
      safesearch:
        description: Safe search level (0-2)
        required: false
        default: "1"
        type: string
      max_results:
        description: Maximum number of results (1-20)
        required: false
        default: "10"
        type: string
      callback_url:
        description: Authenticated Render callback endpoint
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: node47-searxng-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout NODE.47 SearXNG configuration
        uses: actions/checkout@v4

      - name: Start pinned ephemeral SearXNG image
        run: |
          docker run -d --name node47-searxng-actions -p 127.0.0.1:8080:8080 \
            -v "$GITHUB_WORKSPACE/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            -e SEARXNG_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            -e SEARXNG_BIND_ADDRESS=0.0.0.0 \
            -e SEARXNG_PORT=8080 \
            -e SEARXNG_LIMITER=false \
            -e SEARXNG_PUBLIC_INSTANCE=false \
            searxng/searxng:2026.11.20-a7959eeaf

      - name: Execute search and return results to Render
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          QUERY: ${{ inputs.query }}
          CATEGORIES: ${{ inputs.categories }}
          LANGUAGE: ${{ inputs.language }}
          TIME_RANGE: ${{ inputs.time_range }}
          SAFESEARCH: ${{ inputs.safesearch }}
          MAX_RESULTS: ${{ inputs.max_results }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_SECRET: ${{ secrets.NODE47_RENDER_CALLBACK_SECRET }}
        run: |
          python - <<'PY'
          import json, os, sys, time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import URLError, HTTPError

          def callback(payload):
              secret = os.environ.get("CALLBACK_SECRET", "")
              if not secret:
                  raise RuntimeError("NODE47_RENDER_CALLBACK_SECRET is not configured in GitHub Actions")
              body = json.dumps(payload).encode()
              req = Request(
                  os.environ["CALLBACK_URL"],
                  data=body,
                  headers={"Content-Type": "application/json", "X-NODE47-Callback-Secret": secret},
                  method="POST",
              )
              with urlopen(req, timeout=20) as response:
                  if response.status not in (200, 202):
                      raise RuntimeError(f"Render callback returned HTTP {response.status}")

          try:
              ready = False
              for _ in range(45):
                  try:
                      with urlopen("http://127.0.0.1:8080/", timeout=3) as response:
                          if response.status < 500:
                              ready = True
                              break
                  except Exception:
                      time.sleep(2)
              if not ready:
                  raise RuntimeError("SearXNG did not become ready on the GitHub Actions runner")

              params = {
                  "q": os.environ["QUERY"],
                  "format": "json",
                  "categories": os.environ.get("CATEGORIES", "general,news"),
                  "language": os.environ.get("LANGUAGE", "fr"),
                  "safesearch": os.environ.get("SAFESEARCH", "1"),
                  "pageno": "1",
              }
              time_range = os.environ.get("TIME_RANGE", "week")
              if time_range and time_range != "none":
                  params["time_range"] = time_range
              url = "http://127.0.0.1:8080/search?" + urlencode(params)
              with urlopen(url, timeout=90) as response:
                  data = json.loads(response.read().decode("utf-8"))

              raw = data.get("results")
              if not isinstance(raw, list):
                  raise RuntimeError("SearXNG response did not contain a results array")
              limit = max(1, min(20, int(os.environ.get("MAX_RESULTS", "10"))))
              results = []
              for item in raw[:limit]:
                  if not isinstance(item, dict):
                      continue
                  results.append({
                      "title": item.get("title"),
                      "url": item.get("url"),
                      "content": item.get("content") or item.get("snippet"),
                      "engine": item.get("engine"),
                      "category": item.get("category") or item.get("categories"),
                      "published_date": item.get("publishedDate"),
                      "score": item.get("score"),
                  })
              callback({
                  "request_id": os.environ["REQUEST_ID"],
                  "status": "ok",
                  "results": results,
                  "unresponsive_engines": data.get("unresponsive_engines", []),
              })
              print(f"Returned {len(results)} search results to Render")
          except Exception as exc:
              try:
                  callback({
                      "request_id": os.environ["REQUEST_ID"],
                      "status": "error",
                      "error": f"{type(exc).__name__}: {str(exc)[:300]}",
                      "results": [],
                  })
              except Exception as callback_exc:
                  print(f"Callback failed: {type(callback_exc).__name__}: {callback_exc}", file=sys.stderr)
              raise
          PY

      - name: Collect SearXNG diagnostics on failure
        if: failure()
        run: docker logs node47-searxng-actions || true

      - name: Stop ephemeral SearXNG container
        if: always()
        run: docker rm -f node47-searxng-actions || true
