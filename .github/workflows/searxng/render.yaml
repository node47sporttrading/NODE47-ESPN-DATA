services:
  - type: pserv
    name: node47-searxng
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    dockerfilePath: .github/workflows/searxng/Dockerfile
    dockerContext: .github/workflows/searxng
    envVars:
      - key: SEARXNG_SECRET
        generateValue: true
      - key: SEARXNG_PORT
        value: "8080"
      - key: SEARXNG_BIND_ADDRESS
        value: "0.0.0.0"
      - key: SEARXNG_LIMITER
        value: "false"
      - key: SEARXNG_PUBLIC_INSTANCE
        value: "false"
      - key: SEARXNG_IMAGE_PROXY
        value: "false"
