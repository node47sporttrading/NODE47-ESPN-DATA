# Public NODE.47 SearXNG instance. HTTP access remains unauthenticated.
# public_instance is deliberately false: enabling it forces SearXNG's limiter,
# which requires Valkey and would terminate this deployment without that backend.
use_default_settings: true

general:
  debug: false
  instance_name: "NODE.47 Public Search"

search:
  safe_search: 1
  default_lang: "fr"
  autocomplete: ""
  formats:
    - html
    - json

server:
  # Overridden at runtime by the Render-generated SEARXNG_SECRET.
  secret_key: "replace-at-deploy"
  port: 8080
  bind_address: "0.0.0.0"
  limiter: false
  public_instance: false
  image_proxy: false
